name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/PartridgeHunter_Lite.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PartridgeHunter-Lite-APK
          path: build/PartridgeHunter_Lite.apk

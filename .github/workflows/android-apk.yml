name: Build Android Legacy APK

permissions:
  contents: write

on:
  push:
    branches: ["main"]
    paths:
      - "project.godot"
      - "main.tscn"
      - "scripts/**"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-28 build-tools;28.0.3"

      - name: Build Android Legacy APK
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: "Android Legacy"
          export_debug: "true"
          verbose: "true"
          use_preset_export_path: "true"

      - name: Verify APK
        run: |
          find . -type f -name "*.apk" -print
          APK=$(find . -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" ./PartridgeHunter_Legacy.apk
          ls -lh ./PartridgeHunter_Legacy.apk
          unzip -l ./PartridgeHunter_Legacy.apk | grep -E "lib/armeabi-v7a|lib/arm64-v8a" | head -20
          unzip -l ./PartridgeHunter_Legacy.apk | grep "lib/armeabi-v7a/" >/dev/null

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.3-legacy --yes 2>/dev/null || true
          git push --delete origin v0.1.3-legacy 2>/dev/null || true
          gh release create v0.1.3-legacy ./PartridgeHunter_Legacy.apk --title "Partridge Hunter Legacy v0.1.3" --notes "نسخة توافق محسنة للأجهزة القديمة — ARMv7."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PartridgeHunter-Legacy-APK
          path: PartridgeHunter_Legacy.apk
          if-no-files-found: error

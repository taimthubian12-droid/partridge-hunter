name: Build Android Legacy APK

permissions:
  contents: write

on:
  push:
    branches: ["main"]
    paths:
      - "legacy/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Build Godot 3.5 Legacy APK
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/3.5.3-stable/Godot_v3.5.3-stable_export_templates.tpz
          relative_project_path: legacy/
          archive_output: true
          export_preset: "Android Legacy"
          export_debug: "true"

      - name: Copy APK
        run: cp /home/runner/.local/share/godot/builds/Android/*.apk ./PartridgeHunter_Legacy.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1-legacy ./PartridgeHunter_Legacy.apk --title "Partridge Hunter Lite v0.1.1 Legacy" --notes "نسخة اختبار للأجهزة القديمة: Godot 3.5 GLES2 + ARMv7."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PartridgeHunter-Legacy-APK
          path: PartridgeHunter_Legacy.apk
          if-no-files-found: error

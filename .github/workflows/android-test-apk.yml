name: Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Install Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Export test APK
        run: |
          mkdir -p build
          godot --headless --editor --quit-after 2
          godot --headless --path . --export-debug "Android Test APK" build/rahlet_sayd_test.apk
      - name: Verify test APK
        run: test -s build/rahlet_sayd_test.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: rahlet-sayd-test-apk
          path: build/rahlet_sayd_test.apk
